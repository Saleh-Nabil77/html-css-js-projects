<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vue Counter</title>
</head>
<body id="myApp">
    <h3>{{ myNum }}</h3>
    <button @click="increase()">+</button>
    <button @click="decrease()">-</button>
    
    <!-- v-if removes the element -->
    <p v-if="myNum > 9">⚠️ Warning! Number is greater than 9</p>
    
    <!-- v-show hides the element -->
    <p v-show="myNum < 0">⚠️ Warning! Number is less than 0</p>
</body>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const vueApp = Vue.createApp({
        data() {
            return {
                myNum: 5
            }
        },
        methods: {
            increase() {
                this.myNum++;
            },
            decrease() {
                this.myNum--;
            }
        }
    });
    vueApp.mount("#myApp");
</script>
</html>
