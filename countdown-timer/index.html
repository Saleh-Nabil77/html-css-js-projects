<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="timer">
        <div class="box"><span class="days">0</span><small>Days</small></div>
        <div class="box"><span class="hours">0</span><small>Hours</small></div>
        <div class="box"><span class="minutes">0</span><small>Minutes</small></div>
        <div class="box"><span class="seconds">0</span><small>Seconds</small></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
